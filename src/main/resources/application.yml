spring:
  application:
    name: ai-code-review-agent

  ai:
    model:
      chat: anthropic

    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      #base-url: https://api.anthropic.com/v1
      chat:
        options:
          model: claude-haiku-4-5
          temperature: 0.1
          max-tokens: 800

server:
  port: 8080

logging:
  level:
    org.springframework.ai: DEBUG