spring:
  application:
    name: ai-code-review-agent

  ai:
    model:
      chat: openai

    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: qwen/qwen3.6-27b
          temperature: 0.1
          max-tokens: 600

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO
    com.aicodereview.agent: INFO